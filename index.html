<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>

<style>
    body {
        margin: 0;
        background: #090b12;
        color: white;
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
    }

    #game {
        width: min(560px, 100vw);
        padding: 12px;
        box-sizing: border-box;
    }

    #info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
    }

    #status {
        text-align: center;
        height: 22px;
        color: #ffd43b;
        font-weight: bold;
    }

    canvas {
        width: 100%;
        height: auto;
        display: block;
        image-rendering: pixelated;
    }

    button {
        min-width: 44px;
        min-height: 44px;
        background: #111827;
        color: white;
        border: 1px solid #3156a3;
        border-radius: 7px;
        font-size: 18px;
    }

    #controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
    }

    .row {
        display: flex;
        gap: 4px;
    }
</style>
</head>

<body>

<div id="game">

    <div id="info">
        <span>Puntos: <b id="score">0</b></span>
        <span>Vidas: <b id="lives">3</b></span>
        <button id="restart">Reiniciar</button>
    </div>

    <div id="status">Preme unha frecha para comezar</div>

    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="row">
            <button data-dir="up">▲</button>
        </div>

        <div class="row">
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
        </div>
    </div>

</div>

<script src="./src/game.js"></script>

</body>
</html>
