<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>

<style>
    body {
        margin: 0;
        background: #090b12;
        color: white;
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
    }

    #game {
        width: min(560px, 100vw);
        padding: 12px;
        box-sizing: border-box;
    }

    #info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
    }

    #status {
        text-align: center;
        height: 22px;
        color: #ffd43b;
        font-weight: bold;
    }

    canvas {
        width: 100%;
        height: auto;
        display: block;
        image-rendering: pixelated;
    }

    button {
        min-width: 44px;
        min-height: 44px;
        background: #111827;
        color: white;
        border: 1px solid #3156a3;
        border-radius: 7px;
        font-size: 18px;
    }

    #controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
    }

    .row {
        display: flex;
        gap: 4px;
    }

    #game {
        position: relative;
    }

    #start-screen {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(9, 11, 18, 0.94);
        box-sizing: border-box;
    }

    #start-screen[hidden] {
        display: none;
    }

    .start-panel {
        width: min(100%, 420px);
        text-align: center;
    }

    .start-panel h1 {
        margin: 0 0 8px;
        color: #ffd43b;
    }

    .start-panel p {
        margin: 0 0 20px;
        color: #cbd5e1;
    }

    .character-choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .character-choice {
        min-height: 124px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        background: #111827;
        color: white;
        border: 1px solid #3156a3;
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
    }

    .character-choice:hover,
    .character-choice:focus-visible {
        border-color: #ffd43b;
        background: #1b2740;
        outline: 2px solid #ffd43b;
        outline-offset: 2px;
    }

    .character-figure {
        width: 48px;
        height: 48px;
    }

    @media (max-height: 620px) {
        #start-screen {
            position: fixed;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="info">
        <span><span data-i18n="score">Score</span>: <b id="score">0</b></span>
        <span><span data-i18n="lives">Lives</span>: <b id="lives">3</b></span>
        <button id="restart" data-i18n="restart">Restart</button>
    </div>

    <div id="status" aria-live="polite">Press an arrow key to start</div>

    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="row">
            <button data-dir="up">▲</button>
        </div>

        <div class="row">
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
        </div>
    </div>

    <section id="start-screen" aria-labelledby="start-title">
        <div class="start-panel">
            <h1 id="start-title" data-i18n="chooseCharacter">Choose your character</h1>
            <p data-i18n="chooseCharacterDescription">Play as Pac-Man or control one of the ghosts.</p>
            <div class="character-choices">
                <button class="character-choice" data-character="pacman" data-i18n-aria-label="pacman">
                    <svg class="character-figure" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M24 4a20 20 0 1 0 0 40c11 0 20-9 20-20H24L38 10A20 20 0 0 0 24 4Z" fill="#ffd43b"/>
                    </svg>
                    <span data-i18n="pacman">Pac-Man</span>
                </button>
                <button class="character-choice" data-character="ghost-0" data-i18n-aria-label="redGhost">
                    <svg class="character-figure" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M5 43V23a19 19 0 0 1 38 0v20l-7-5-7 5-7-5-7 5-5-5Z" fill="#e05252"/>
                        <ellipse cx="18" cy="23" rx="5" ry="7" fill="white"/><ellipse cx="31" cy="23" rx="5" ry="7" fill="white"/>
                        <circle cx="20" cy="24" r="2.5" fill="#111827"/><circle cx="33" cy="24" r="2.5" fill="#111827"/>
                    </svg>
                    <span data-i18n="redGhost">Red Ghost</span>
                </button>
                <button class="character-choice" data-character="ghost-1" data-i18n-aria-label="orangeGhost">
                    <svg class="character-figure" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M5 43V23a19 19 0 0 1 38 0v20l-7-5-7 5-7-5-7 5-5-5Z" fill="#e99b35"/>
                        <ellipse cx="18" cy="23" rx="5" ry="7" fill="white"/><ellipse cx="31" cy="23" rx="5" ry="7" fill="white"/>
                        <circle cx="20" cy="24" r="2.5" fill="#111827"/><circle cx="33" cy="24" r="2.5" fill="#111827"/>
                    </svg>
                    <span data-i18n="orangeGhost">Orange Ghost</span>
                </button>
                <button class="character-choice" data-character="ghost-2" data-i18n-aria-label="pinkGhost">
                    <svg class="character-figure" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M5 43V23a19 19 0 0 1 38 0v20l-7-5-7 5-7-5-7 5-5-5Z" fill="#d66ad9"/>
                        <ellipse cx="18" cy="23" rx="5" ry="7" fill="white"/><ellipse cx="31" cy="23" rx="5" ry="7" fill="white"/>
                        <circle cx="20" cy="24" r="2.5" fill="#111827"/><circle cx="33" cy="24" r="2.5" fill="#111827"/>
                    </svg>
                    <span data-i18n="pinkGhost">Pink Ghost</span>
                </button>
            </div>
        </div>
    </section>

</div>

<script src="./src/game.js"></script>

</body>
</html>
